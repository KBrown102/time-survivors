<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>时代幸存者 · 复刻 Demo</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-user-select:none; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0a0a12; font-family:"Segoe UI","Microsoft YaHei",sans-serif; color:#e8e8f0; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#05050a; }
  canvas { display:block; image-rendering:pixelated; image-rendering:crisp-edges; background:#12121c; box-shadow:0 0 40px rgba(0,0,0,.8); }

  /* ---------- 通用面板 ---------- */
  .layer { position:absolute; inset:0; display:none; z-index:10; pointer-events:none; }
  .layer.show { display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:auto; }
  .hidden { display:none !important; }

  /* ---------- 主菜单 ---------- */
  #menu { background:radial-gradient(ellipse at 50% 30%, #1a1a30 0%, #08080f 75%); }
  .title { font-size:clamp(32px,7vw,72px); font-weight:800; letter-spacing:2px;
           background:linear-gradient(90deg,#ffcf6b,#ff7b54,#ffcf6b); -webkit-background-clip:text; background-clip:text; color:transparent;
           text-shadow:0 4px 24px rgba(255,140,60,.25); margin-bottom:4px; }
  .subtitle { font-size:clamp(13px,2vw,17px); color:#8a8ab0; margin-bottom:34px; letter-spacing:1px; }
  .howto { max-width:560px; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08); border-radius:14px;
           padding:18px 24px; margin-bottom:30px; line-height:1.9; font-size:14px; color:#c8c8e0; }
  .howto b { color:#ffcf6b; }
  .btn { pointer-events:auto; cursor:pointer; border:none; border-radius:12px; padding:14px 40px; font-size:18px; font-weight:700;
         color:#1a1208; background:linear-gradient(180deg,#ffd97a,#ffb04a); box-shadow:0 6px 0 #c07820, 0 10px 20px rgba(0,0,0,.4);
         transition:transform .08s, box-shadow .08s; font-family:inherit; }
  .btn:hover { transform:translateY(2px); box-shadow:0 4px 0 #c07820, 0 6px 14px rgba(0,0,0,.4); }
  .btn:active { transform:translateY(6px); box-shadow:0 0 0 #c07820; }
  .btn.sec { background:linear-gradient(180deg,#6a6a90,#4a4a68); color:#e8e8f0; box-shadow:0 6px 0 #2a2a3c,0 10px 20px rgba(0,0,0,.4); }
  .btn.sec:active { box-shadow:0 0 0 #2a2a3c; }

  /* ---------- 选角 ---------- */
  #select { background:rgba(6,6,14,.92); }
  .sel-title { font-size:26px; font-weight:800; color:#ffcf6b; margin-bottom:22px; }
  .heroes { display:flex; gap:18px; flex-wrap:wrap; justify-content:center; max-width:840px; margin-bottom:26px; }
  .hero-card { pointer-events:auto; cursor:pointer; width:180px; background:rgba(255,255,255,.05); border:2px solid rgba(255,255,255,.1);
               border-radius:14px; padding:16px; text-align:center; transition:transform .1s, border-color .1s, background .1s; }
  .hero-card:hover { transform:translateY(-6px); border-color:#ffcf6b; background:rgba(255,207,107,.08); }
  .hero-card.sel { border-color:#ff8c3c; background:rgba(255,140,60,.12); }
  .hero-card canvas { margin:0 auto 10px; background:transparent; box-shadow:none; }
  .hero-name { font-size:17px; font-weight:700; color:#fff; margin-bottom:4px; }
  .hero-role { font-size:12px; color:#8a8ab0; margin-bottom:8px; }
  .hero-abil { font-size:12px; line-height:1.6; color:#c8c8e0; min-height:56px; }
  .hero-abil b { color:#7ec8ff; }

  /* ---------- HUD ---------- */
  #hud { position:absolute; inset:0; z-index:6; pointer-events:none; font-size:14px; }
  #topbar { position:absolute; top:0; left:0; right:0; height:56px; display:flex; align-items:center; justify-content:center;
            background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,0)); }
  #timer { font-size:30px; font-weight:800; color:#fff; text-shadow:0 2px 6px #000; letter-spacing:2px; font-variant-numeric:tabular-nums; }
  #stats { position:absolute; top:12px; left:16px; display:flex; gap:16px; text-shadow:0 1px 3px #000; }
  .stat { display:flex; align-items:center; gap:5px; font-weight:700; }
  .stat .ic { font-size:15px; }
  #stats .lv { color:#7ec8ff; } #stats .gold { color:#ffcf6b; } #stats .kill { color:#ff9a9a; }
  #xpbar-wrap { position:absolute; top:0; left:0; right:0; height:7px; background:rgba(0,0,0,.5); }
  #xpbar { height:100%; width:0%; background:linear-gradient(90deg,#4a9eff,#7ec8ff); transition:width .12s; box-shadow:0 0 8px #4a9eff; }
  #wpnbar { position:absolute; bottom:14px; left:50%; transform:translateX(-50%); display:flex; gap:8px; }
  .wslot { width:44px; height:44px; border-radius:9px; background:rgba(0,0,0,.5); border:1px solid rgba(255,255,255,.15);
           display:flex; align-items:center; justify-content:center; position:relative; }
  .wslot canvas { background:transparent; box-shadow:none; }
  .wslot .lvtag { position:absolute; bottom:-3px; right:-3px; background:#ffb04a; color:#1a1208; font-size:10px; font-weight:800;
                  border-radius:6px; padding:0 4px; }

  /* ---------- 升级三选一 ---------- */
  #levelup { background:rgba(6,6,14,.82); }
  .lu-title { font-size:24px; font-weight:800; color:#ffcf6b; margin-bottom:6px; }
  .lu-sub { font-size:13px; color:#8a8ab0; margin-bottom:22px; }
  .cards { display:flex; gap:18px; flex-wrap:wrap; justify-content:center; max-width:760px; }
  .card { pointer-events:auto; cursor:pointer; width:210px; background:linear-gradient(180deg,rgba(40,40,64,.95),rgba(24,24,40,.95));
          border:2px solid rgba(255,255,255,.12); border-radius:14px; padding:18px; text-align:center;
          transition:transform .1s, border-color .1s; }
  .card:hover { transform:translateY(-6px) scale(1.03); border-color:#ffcf6b; }
  .card canvas { margin:0 auto 12px; background:transparent; box-shadow:none; }
  .card .cn { font-size:16px; font-weight:700; color:#fff; margin-bottom:3px; }
  .card .ct { font-size:11px; margin-bottom:9px; letter-spacing:1px; }
  .card .ct.NEW { color:#7dffa0; } .card .ct.UP { color:#7ec8ff; } .card .ct.PAS { color:#ffcf6b; }
  .card .cd { font-size:12px; line-height:1.55; color:#c0c0d8; min-height:52px; }

  /* ---------- 结算 ---------- */
  #results { background:rgba(6,6,14,.94); }
  .rs-title { font-size:38px; font-weight:800; margin-bottom:8px; }
  .rs-title.win { color:#7dffa0; } .rs-title.lose { color:#ff7a7a; }
  .rs-sub { font-size:14px; color:#a0a0c0; margin-bottom:24px; }
  .rs-grid { display:grid; grid-template-columns:auto auto; gap:10px 34px; margin-bottom:30px; font-size:16px; }
  .rs-grid .k { color:#8a8ab0; text-align:right; }
  .rs-grid .v { color:#fff; font-weight:700; text-align:left; font-variant-numeric:tabular-nums; }

  /* ---------- 暂停/提示 ---------- */
  #pausehint { position:absolute; top:12px; right:16px; font-size:12px; color:#6a6a88; z-index:6; }
  #paused { background:rgba(6,6,14,.7); }
  .pz { font-size:40px; font-weight:800; color:#fff; letter-spacing:6px; }
  .toast { position:absolute; top:64px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.7);
           padding:8px 20px; border-radius:20px; font-size:14px; color:#ffcf6b; z-index:7; pointer-events:none;
           opacity:0; transition:opacity .3s; font-weight:700; }
  .toast.show { opacity:1; }

  /* ---------- 通用面板标题 ---------- */
  .panel-title { font-size:26px; font-weight:800; color:#ffcf6b; margin-bottom:22px; letter-spacing:1px; text-shadow:0 2px 18px rgba(255,140,60,.2); }
  .panel-title .pt { font-size:15px; color:#c8c8e0; font-weight:600; margin-left:14px; }
  .panel-title .pt b { color:#ffcf6b; }
  .row-btns { display:flex; gap:16px; }

  /* ---------- 存档选择 ---------- */
  #saves { background:rgba(7,6,14,.97); padding:30px; gap:18px; }
  .saves-frame { width:min(960px,94vw); padding:22px 26px; display:flex; flex-direction:column; align-items:center; gap:18px; }
  .saves-grid { display:flex; gap:22px; flex-wrap:wrap; justify-content:center; }
  .save-card { pointer-events:auto; width:260px; background:linear-gradient(180deg,rgba(40,32,58,.9),rgba(22,18,34,.95)); border:2px solid #4a3a5a; border-radius:12px; padding:18px; text-align:center; transition:transform .1s,border-color .1s; }
  .save-card:hover { transform:translateY(-5px); border-color:#ffcf6b; }
  .save-num { font-size:20px; font-weight:800; color:#ffcf6b; margin-bottom:10px; }
  .save-meta { font-size:13px; color:#b8b0c8; margin:4px 0; }
  .save-res { font-size:14px; font-weight:700; color:#fff; margin:12px 0; }
  .save-btns { display:flex; gap:10px; justify-content:center; }
  .save-btns .btn { padding:9px 18px; font-size:14px; }

  /* ---------- 关卡选择 ---------- */
  #stages { background:radial-gradient(ellipse at 50% 18%, #1c1c34 0%, #08080f 82%); }
  .stage-list { display:flex; gap:20px; flex-wrap:wrap; justify-content:center; max-width:920px; margin-bottom:28px; }
  .stage-card { width:200px; overflow:hidden; border-radius:16px; cursor:pointer;
                background:rgba(255,255,255,.05); border:2px solid rgba(255,255,255,.12);
                transition:transform .12s, border-color .12s, box-shadow .12s; position:relative; }
  .stage-card:hover { transform:translateY(-6px); border-color:#ffcf6b; box-shadow:0 12px 34px rgba(0,0,0,.55); }
  .stage-card.sel { border-color:#ff8c3c; box-shadow:0 0 0 2px rgba(255,140,60,.4), 0 12px 34px rgba(0,0,0,.55); }
  .stage-card.locked { filter:grayscale(.85) brightness(.55); cursor:not-allowed; }
  .stage-card.locked:hover { transform:none; border-color:rgba(255,255,255,.12); box-shadow:none; }
  .stage-swatch { height:86px; }
  .stage-name { font-size:18px; font-weight:800; color:#fff; padding:10px 12px 2px; }
  .stage-en { font-size:11px; color:#9a9ac0; letter-spacing:2px; padding:0 12px 8px; }
  .stage-meta { display:flex; flex-direction:column; gap:4px; padding:0 12px 14px; font-size:12px; color:#c8c8e0; }
  .stage-meta .star { color:#ffcf6b; letter-spacing:1px; }
  .stage-lock { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
                 background:rgba(0,0,0,.58); color:#ff9a9a; font-size:13px; font-weight:700; text-align:center; padding:10px; }

  /* ============ 新版 UI 结构（沿用像素暗金风，借用原版骨架） ============ */
  .layer { display:none; }
  .layer.show { display:flex; }

  .frame { background:linear-gradient(180deg,#1a1426,#0e0a18); border:3px solid #6a4a2a;
           border-radius:6px; box-shadow:0 0 0 2px #2a1a10, 0 0 0 4px #8a5a2a, inset 0 0 30px rgba(0,0,0,.6); position:relative; }

  #topres { position:absolute; top:0; left:0; right:0; display:flex; justify-content:flex-end; gap:10px; padding:10px 14px; z-index:25; pointer-events:none; }
  .res { display:flex; align-items:center; gap:6px; background:rgba(0,0,0,.55); border:1px solid #8a5a2a; border-radius:5px; padding:6px 12px; font-weight:800; color:#ffcf6b; pointer-events:auto; }
  .res .ic { font-size:14px; }

  #menu { background:radial-gradient(ellipse at 72% 28%, #1a1530 0%, #07060e 80%); }
  .mm-title { position:absolute; top:54px; right:60px; text-align:right; }
  .mm-title h1 { font-size:56px; font-weight:900; letter-spacing:3px; color:#fff; text-shadow:0 4px 24px rgba(255,140,60,.3); }
  .mm-title .ch { display:block; font-size:20px; color:#ffcf6b; letter-spacing:10px; margin-top:4px; }
  .mm-menu { position:absolute; top:50%; right:60px; transform:translateY(-50%); display:flex; flex-direction:column; gap:12px; width:240px; }
  .mm-btn { pointer-events:auto; cursor:pointer; text-align:center; padding:14px; font-size:18px; font-weight:700; color:#e8e8f0;
            background:linear-gradient(180deg,#2a2238,#181226); border:2px solid #4a3a5a; border-radius:6px; transition:transform .08s,border-color .1s,background .1s; }
  .mm-btn:hover { border-color:#ffcf6b; background:linear-gradient(180deg,#34284a,#1e1632); transform:translateX(-4px); }
  .mm-btn.primary { color:#1a1208; background:linear-gradient(180deg,#ffd97a,#ffb04a); border-color:#c07820; box-shadow:0 4px 0 #c07820; }
  .mm-btn.primary:active { transform:translateY(3px); box-shadow:0 1px 0 #c07820; }
  .mm-steam { position:absolute; left:18px; bottom:16px; font-size:12px; color:#6a6a88; max-width:240px; }

  #unlocks { background:rgba(7,6,14,.97); }
  .un-frame { width:min(960px,94vw); height:min(640px,92vh); padding:18px 20px; display:flex; flex-direction:column; }
  .un-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:16px; flex-wrap:wrap; }
  .un-prog { font-size:14px; color:#c8c8e0; } .un-prog b { color:#7dffa0; }
  .un-toggle { display:flex; align-items:center; gap:8px; font-size:13px; color:#c8c8e0; cursor:pointer; pointer-events:auto; }
  .un-toggle .sw { width:38px; height:20px; border-radius:10px; background:#3a2a44; position:relative; transition:background .15s; }
  .un-toggle .sw.on { background:#7dffa0; }
  .un-toggle .sw::after { content:''; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#fff; transition:left .15s; }
  .un-toggle .sw.on::after { left:20px; }
  .un-list { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:8px; padding-right:6px; }
  .un-row { display:flex; align-items:center; gap:14px; padding:10px 14px; background:rgba(255,255,255,.03); border:1px solid #3a2a44; border-radius:6px; }
  .un-row.locked { opacity:.55; }
  .un-row.done { border-color:#7dffa0; background:rgba(125,255,160,.06); }
  .un-ic { width:46px; height:46px; flex:0 0 46px; display:flex; align-items:center; justify-content:center; font-size:26px; background:rgba(0,0,0,.4); border:1px solid #4a3a5a; border-radius:6px; }
  .un-info { flex:1; min-width:0; }
  .un-name { font-size:15px; font-weight:700; color:#ffcf6b; }
  .un-desc { font-size:12.5px; color:#b8b0c8; margin-top:2px; }
  .un-reward { font-size:12px; color:#7ec8ff; margin-top:3px; }
  .un-bar-wrap { width:150px; flex:0 0 150px; }
  .un-bar-bg { height:12px; background:#000; border:1px solid #4a3a5a; border-radius:6px; overflow:hidden; }
  .un-bar { height:100%; background:linear-gradient(90deg,#ffb04a,#ffcf6b); }
  .un-count { font-size:11px; color:#c8c8e0; text-align:center; margin-top:3px; }
  .un-status { width:84px; flex:0 0 84px; text-align:center; font-size:13px; font-weight:800; }
  .un-status.done { color:#7dffa0; } .un-status.todo { color:#8a8ab0; }

  #select { background:rgba(7,6,14,.97); padding:30px; gap:18px; }
  .ch-layout { display:flex; gap:20px; width:min(1140px,96vw); height:min(640px,90vh); }
  .ch-left { width:340px; flex:0 0 340px; padding:16px; display:flex; flex-direction:column; }
  .ch-right { flex:1; padding:16px; display:flex; flex-direction:column; min-width:0; }
  .ch-portrait { width:100%; height:190px; background:rgba(0,0,0,.35); border:1px solid #4a3a5a; border-radius:6px; display:flex; align-items:center; justify-content:center; margin-bottom:12px; }
  .ch-portrait canvas { image-rendering:pixelated; }
  .ch-lname { font-size:24px; font-weight:800; color:#fff; }
  .ch-lrole { font-size:13px; color:#ffcf6b; margin:2px 0 10px; }
  .ch-story { font-size:13px; line-height:1.7; color:#c8c0d8; margin-bottom:10px; min-height:64px; }
  .ch-abil { font-size:13px; line-height:1.6; color:#7ec8ff; margin-bottom:12px; }
  .ch-stats { flex:1; overflow-y:auto; display:grid; grid-template-columns:1fr 1fr; gap:5px 14px; font-size:12.5px; align-content:start; }
  .ch-stat { display:flex; justify-content:space-between; border-bottom:1px dashed rgba(255,255,255,.08); padding:3px 0; }
  .ch-stat .k { color:#9a9ac0; } .ch-stat .v { color:#e8e8f0; font-weight:700; }

  .ch-card .cn { font-size:15px; font-weight:700; color:#fff; }
  .ch-card .cr { font-size:11px; color:#8a8ab0; margin-top:2px; }

  #options { background:rgba(7,6,14,.97); padding:30px; gap:18px; }
  .opt-frame { width:min(720px,94vw); height:min(600px,90vh); padding:18px 22px; display:flex; flex-direction:column; }
  .opt-group { margin-bottom:14px; }

  .opt-row { display:flex; align-items:center; justify-content:space-between; padding:7px 0; font-size:14px; }

  .sel-lang { background:#1a1426; color:#ffcf6b; border:1px solid #4a3a5a; border-radius:5px; padding:6px 10px; font-size:13px; cursor:pointer; }
  .sw { width:38px; height:20px; border-radius:10px; background:#3a2a44; position:relative; transition:background .15s; cursor:pointer; }
  .sw.on { background:#7dffa0; }
  .sw::after { content:''; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#fff; transition:left .15s; }

  #skilltree { background:rgba(7,6,14,.97); }

  .sk-node.hero .sk-name { bottom:-24px; font-size:13px; color:#ffcf6b; }
  .sk-node.slot { width:64px; height:64px; border-color:rgba(255,207,107,.55); border-radius:50%; }
  .sk-node.can { box-shadow:0 0 22px rgba(255,207,107,.6); border-color:#ffcf6b; }
  .sk-node.can:hover { transform:translate(-50%,-50%) scale(1.14); z-index:5; }
  .sk-node.owned { background:rgba(125,255,160,.18); border-color:#7dffa0; box-shadow:0 0 16px rgba(125,255,160,.4); }
  .sk-node.locked { opacity:.42; cursor:not-allowed; }
  .sk-node.sel { border-color:#fff; box-shadow:0 0 0 3px #fff, 0 0 22px rgba(255,255,255,.45); z-index:6; }
  .sk-node .buy-badge { position:absolute; top:-10px; right:-10px; background:#ffcf6b; color:#1a1208; font-size:9px; font-weight:800; padding:1px 5px; border-radius:8px; box-shadow:0 1px 4px rgba(0,0,0,.5); }

  .sk-topbar { position:absolute; top:14px; left:14px; right:14px; display:flex; align-items:center; justify-content:space-between; z-index:12; pointer-events:none; }
  .sk-topbar > * { pointer-events:auto; }
  .sk-title { font-size:18px; font-weight:800; color:#ffcf6b; text-shadow:0 2px 8px rgba(0,0,0,.6); }
  .sk-res { display:flex; gap:10px; }
  .sk-res .res { display:flex; align-items:center; gap:6px; background:rgba(0,0,0,.55); border:1px solid #8a5a2a; border-radius:5px; padding:6px 12px; font-weight:800; color:#ffcf6b; }
  .sk-res .res:nth-child(2) { color:#9ad6ff; }

  .sk-detail-panel { position:absolute; top:60px; right:14px; width:300px; max-height:calc(100% - 140px); overflow-y:auto; z-index:12; background:rgba(20,16,34,.94); border:2px solid #6a4a2a; border-radius:10px; padding:14px; box-shadow:0 8px 32px rgba(0,0,0,.5); }
  .sk-detail-title { font-size:18px; font-weight:800; color:#fff; margin-bottom:4px; }
  .sk-detail-type { font-size:11px; font-weight:700; padding:2px 8px; border-radius:4px; display:inline-block; margin-bottom:10px; }
  .sk-detail-desc { font-size:13px; color:#c8c0d8; line-height:1.6; margin-bottom:10px; }
  .sk-detail-eff { font-size:13px; color:#7dffa0; margin-bottom:6px; }
  .sk-detail-lv { font-size:13px; color:#ffcf6b; margin-bottom:14px; }
  .sk-detail-cost { font-size:13px; color:#c8c8e0; margin-bottom:12px; }
  .sk-buy { width:100%; pointer-events:auto; cursor:pointer; text-align:center; padding:12px; font-size:15px; font-weight:800; color:#1a1208;
            background:linear-gradient(180deg,#ffd97a,#ffb04a); border:none; border-radius:6px; box-shadow:0 4px 0 #c07820; }
  .sk-buy:active { transform:translateY(3px); box-shadow:0 1px 0 #c07820; }
  .sk-buy:disabled { background:#444; color:#888; box-shadow:none; cursor:not-allowed; }
  .sk-hint { font-size:12px; color:#8a8ab0; line-height:1.6; }

  .sk-bottombar { position:absolute; bottom:14px; left:14px; right:14px; display:flex; justify-content:space-between; align-items:center; z-index:12; pointer-events:none; }
  .sk-bottombar > * { pointer-events:auto; }
  .sk-bottombar .btn { min-width:120px; }

  .row-btns { display:flex; gap:14px; }

  /* HUD · 特技槽 */
  #spec { position:absolute; left:14px; bottom:14px; z-index:6; display:flex; align-items:center; gap:6px;
          background:rgba(0,0,0,.5); border:1px solid rgba(255,255,255,.15); border-radius:10px; padding:6px 10px; }
  #spec-ic { font-size:18px; }
  #spec-track { width:54px; height:6px; background:rgba(255,255,255,.15); border-radius:4px; overflow:hidden; }
  #spec-bar { height:100%; width:0; background:linear-gradient(90deg,#7dffa0,#5fd08a); }
  #spec.cd #spec-bar { background:linear-gradient(90deg,#ffe17a,#ffcf6b); }
  #spec-txt { font-size:12px; font-weight:700; color:#7dffa0; min-width:34px; }
  #spec.cd #spec-txt { color:#ffe17a; }

  /* 暂停 · 退出提示框 */
  #paused { background:rgba(6,6,14,.72); display:flex; align-items:center; justify-content:center; }
  .pz-box { background:linear-gradient(180deg,#1d1d2e,#15151f); border:1px solid rgba(255,255,255,.16);
            border-radius:16px; padding:26px 30px; text-align:center; box-shadow:0 16px 48px rgba(0,0,0,.6); }
  .pz-title { font-size:26px; font-weight:800; color:#fff; letter-spacing:3px; margin-bottom:10px; }
  .pz-msg { font-size:14px; color:#b8b8d0; margin-bottom:20px; }
  .pz-btns { display:flex; gap:14px; justify-content:center; }
  .btn.danger { background:linear-gradient(180deg,#ff7a7a,#e05050); box-shadow:0 4px 0 #a02a2a; color:#fff; }

  /* 顶部资源栏 · 时之结晶 */
  #topres .res:nth-child(2) .ic { color:#9ad6ff; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div id="xpbar-wrap"><div id="xpbar"></div></div>
    <div id="topbar"><div id="timer">00:00</div></div>
    <div id="stats">
      <div class="stat lv"><span class="ic">⭐</span><span id="s-lv">Lv 1</span></div>
      <div class="stat gold"><span class="ic">◈</span><span id="s-gold">0</span></div>
      <div class="stat kill"><span class="ic">☠</span><span id="s-kill">0</span></div>
    </div>
    <div id="wpnbar"></div>
    <div id="spec"><span id="spec-ic">⚡</span><div id="spec-track"><div id="spec-bar"></div></div><span id="spec-txt">就绪</span></div>
    <div id="pausehint">空格 特技 · ESC 暂停 · WASD/方向键 移动</div>
    <div id="toast" class="toast"></div>
  </div>

  <!-- 主菜单 -->
  <div id="menu" class="layer show">
    <div class="mm-title"><h1>TIME SURVIVORS</h1><span class="ch">时 代 幸 存 者</span></div>
    <div class="mm-menu">
      <button class="mm-btn primary" id="btn-start">开始游戏</button>
      <button class="mm-btn" id="btn-unlocks">已解锁</button>
      <button class="mm-btn" id="btn-options">选项</button>
      <button class="mm-btn" id="btn-exit">退出</button>
    </div>
    <div class="mm-steam">STEAM · 单机离线 · 本地服务器运行</div>
  </div>

  <!-- 顶部资源栏（常驻） -->
  <div id="topres">
    <div class="res"><span class="ic">◈</span><span id="res-gold">0</span></div>
    <div class="res"><span class="ic">💎</span><span id="res-mats">0</span></div>
  </div>

  <!-- 存档选择 -->
  <div id="saves" class="layer hidden">
    <div class="frame saves-frame">
      <div class="panel-title">选择存档</div>
      <div class="saves-grid" id="saves-grid"></div>
      <button class="btn sec" id="btn-saves-back">返回</button>
    </div>
  </div>

  <!-- 关卡选择 -->
  <div id="stages" class="layer hidden">
    <div class="frame" style="padding:18px 22px; display:flex; flex-direction:column; align-items:center; gap:18px;">
      <div class="panel-title">选择关卡</div>
      <div class="stage-list" id="stage-list"></div>
      <div class="row-btns">
        <button class="btn sec" id="btn-stage-back">返回</button>
        <button class="btn" id="btn-choose">选好 · 去选角色</button>
      </div>
    </div>
  </div>

  <!-- 已解锁 -->
  <div id="unlocks" class="layer hidden">
    <div class="frame un-frame">
      <div class="un-head">
        <div class="panel-title" style="margin:0">已解锁</div>
        <div class="un-prog" id="un-prog"></div>
        <div class="un-toggle" id="un-toggle"><span>仅显示未解锁</span><span class="sw" id="un-sw"></span></div>
      </div>
      <div class="un-list" id="un-list"></div>
      <div class="row-btns" style="margin-top:14px"><button class="btn sec" id="btn-unlocks-back">返回</button></div>
    </div>
  </div>

  <!-- 选项 -->
  <div id="options" class="layer hidden">
    <div class="frame opt-frame">
      <div class="panel-title" style="margin-bottom:14px">选项</div>
      <div id="opt-body"></div>
      <div class="opt-btns">
        <button class="btn sec" id="btn-opt-reset">重置存档</button>
        <button class="btn sec" id="btn-opt-default">默认</button>
        <button class="btn" id="btn-opt-done">完成</button>
      </div>
    </div>
  </div>

  <!-- 技能树（可拖动缩放地图） -->
  <div id="skilltree" class="layer hidden">
    <div class="sk-layout">
      <!-- 全屏地图层 -->
      <div class="sk-left" id="sk-map">
        <div class="sk-map-layer" id="sk-layer">
          <svg class="sk-lines" id="sk-lines" width="2400" height="1600" viewBox="0 0 2400 1600"></svg>
          <div class="sk-nodes" id="sk-nodes"></div>
        </div>
        <div class="sk-map-hint">拖拽移动 · 滚轮缩放</div>
      </div>

      <!-- 顶部浮动标题栏 -->
      <div class="sk-topbar">
        <div class="sk-title">技能树 · 激活全部技能 / 英雄 / 装备槽</div>
        <div class="sk-res">
          <div class="res"><span class="ic">◈</span><span id="sk-gold">0</span></div>
          <div class="res"><span class="ic">💎</span><span id="sk-mats">0</span></div>
        </div>
      </div>

      <!-- 右侧浮动详情面板 -->
      <div class="sk-detail-panel" id="sk-detail-panel">
        <div id="sk-detail"><div class="sk-hint">点击地图节点查看详情，满足条件后消耗金币 / 时之结晶激活。</div></div>
        <button class="sk-buy" id="sk-buy" style="display:none">激活</button>
      </div>

      <!-- 底部按钮栏 -->
      <div class="sk-bottombar">
        <button class="btn sec" id="btn-skill-back">返回</button>
        <button class="btn" id="sk-start">开始</button>
      </div>
    </div>
  </div>

  <!-- 选角（左详情 + 右网格） -->
  <div id="select" class="layer hidden">
    <div class="ch-layout">
      <div class="frame ch-left">
        <div class="ch-portrait" id="ch-portrait"></div>
        <div class="ch-lname" id="ch-lname"></div>
        <div class="ch-lrole" id="ch-lrole"></div>
        <div class="ch-story" id="ch-story"></div>
        <div class="ch-abil" id="ch-abil"></div>
        <div class="ch-stats" id="ch-stats"></div>
      </div>
      <div class="frame ch-right">
        <div class="panel-title" style="margin-bottom:14px">选择英雄</div>
        <div class="ch-grid" id="ch-grid"></div>
      </div>
    </div>
    <div class="row-btns" style="margin-top:6px">
      <button class="btn sec" id="btn-choose-back">返回</button>
      <button class="btn" id="btn-play">出 发</button>
    </div>
  </div>

  <!-- 升级 -->
  <div id="levelup" class="layer hidden">
    <div class="lu-title" id="lu-title">升级！</div>
    <div class="lu-sub">选一个（自动暂停）</div>
    <div class="cards" id="lu-cards"></div>
  </div>

  <!-- 结算 -->
  <div id="results" class="layer hidden">
    <div class="rs-title" id="rs-title">胜利</div>
    <div class="rs-sub" id="rs-sub"></div>
    <div class="rs-grid" id="rs-grid"></div>
    <button class="btn" id="btn-again">进入技能树</button>
  </div>

  <!-- 暂停 + 退出提示 -->
  <div id="paused" class="layer hidden">
    <div class="pz-box">
      <div class="pz-title">游戏暂停</div>
      <div class="pz-msg">确定要退出本局游戏吗？进度不会保存。</div>
      <div class="pz-btns">
        <button class="btn sec" id="btn-resume">继续游戏</button>
        <button class="btn danger" id="btn-quit">退出游戏</button>
      </div>
    </div>
  </div>
</div>
<script type="module" src="src/ui/main.js"></script>
</body>
</html>
